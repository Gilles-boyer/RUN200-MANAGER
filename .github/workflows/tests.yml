name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php-version }} et Vite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: run200_manager
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, gd, mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: run200_manager/package-lock.json

      - name: Installer les dépendances PHP verrouillées
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Installer les dépendances JavaScript verrouillées
        run: npm ci

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Construire les assets
        run: npm run build

      - name: Exécuter les tests
        run: php artisan test
